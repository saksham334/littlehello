<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LittleHello — a gentle, low-pressure place to make platonic friends at your own pace." />
    <meta name="theme-color" content="#FFF9F2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: preconnect warms up the connection so fonts load faster -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One request for all three families. display=swap shows fallback text
         immediately, then swaps in the real font, so text is never invisible. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap"
    />

    <title>LittleHello · Small hellos. Real friendships.</title>
  </head>
  <body>
    <!-- React renders the whole app inside this div -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
